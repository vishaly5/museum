<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>পেইন্টিং গ্যালারি (Painting Gallery) | Salar Jung Museum</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="sliderHeaderDiv">
    <div class="container">
      <header>
        <div class="logoLft">
          <a href="../index.html" class="logo logoTwo"><img src="images/logo-moc.png" onerror="this.onerror=null; this.src='../MusicalClock/images/logo-moc.png';" alt="Ministry of Culture"></a>
        </div>
        <div class="logoRgt">
          <div class="langDiv">
            <span class="anuIcn"><img src="images/logo-anu.png" onerror="this.onerror=null; this.src='../MusicalClock/images/logo-anu.png';" alt="Anuvadini"></span>
            <select class="form formLang" id="languageSelector" aria-label="Select language">
              <option value="bengali" selected>বাংলা (Bengali)</option>
              <option value="malayalam">മലയാളം (Malayalam)</option>
            </select>
          </div>
        </div>
      </header>
    </div>
  </div>

  <main>
    <!-- Intro -->
    <section class="gallery-intro langCnt" id="bengali" style="display: block;">
      <h1>পেইন্টিং গ্যালারি (ওয়েস্টার্ন ব্লক)</h1>
      <p>অডিও গাইড অ্যাপের উদ্দেশ্যে পেইন্টিং গ্যালারি থেকে নির্বাচিত নিম্নলিখিত বস্তুগুলি।</p>
    </section>
    <section class="gallery-intro langCnt" id="malayalam">
      <h1>പെയിന്റിംഗ് ഗാലറി (വെസ്റ്റേൺ ബ്ലോക്ക്)</h1>
      <p>ആഡിയോ ഗൈഡ് ആപ്പ് ആവശ്യത്തിനായി പെയിന്റിംഗ് ഗാലറിയിൽ നിന്ന് തിരഞ്ഞെടുത്തിരിക്കുന്ന വസ്തുക്കൾ.</p>
    </section>

    <!-- Gallery Grid: cards are built from js/artworksData.js -->
    <section class="gallery-grid" id="galleryGrid"></section>
  </main>

  <footer>
    <p id="footerText">© 2024 All rights reserved, By <a href="https://anuvadini.aicte-india.org/" target="_blank" rel="noreferrer">Anuvadini AI</a></p>
  </footer>

  <script src="js/artworksData.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
