<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>آधुनिक चित्रकला दीर्घा | Modern Paintings Gallery | Salar Jung Museum</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/artworksData.js"></script>
</head>
<body>
  <!-- Fixed Sticky Header -->
  <div class="sliderHeaderDiv">
    <div class="container">
      <header>
        <div class="logoLft">
          <a href="../index.html" class="logo logoTwo"><img src="images/logo-moc.png" onerror="this.onerror=null; this.src='../MusicalClock/images/logo-moc.png';" alt="Ministry of Culture"></a>
        </div>
        <div class="logoRgt">
          <div class="langDiv">
            <span class="anuIcn"><img src="images/logo-anu.png" onerror="this.onerror=null; this.src='../MusicalClock/images/logo-anu.png';" alt="Anuvadini"></span>
            <select class="form formLang" id="languageSelector" aria-label="Select language">
              <option value="hindi" selected>हिन्दी (Hindi)</option>
              <option value="english">English</option>
              <option value="telugu">తెలుగు (Telugu)</option>
              <option value="urdu">اردو (Urdu)</option>
              <option value="bengali">বাংলা (Bengali)</option>
              <option value="gujarati">ગુજરાતી (Gujarati)</option>
              <option value="kannada">ಕನ್ನಡ (Kannada)</option>
              <option value="odia">ଓଡ଼ିଆ (Odia)</option>
              <option value="marathi">मराठी (Marathi)</option>
              <option value="malayalam">മലയാളം (Malayalam)</option>
              <option value="tamil">தமிழ் (Tamil)</option>
            </select>
          </div>
        </div>
      </header>
    </div>
  </div>

  <main>
    <section class="gallery-intro">
      <h1 id="galleryTitle">आधुनिक चित्रकला दीर्घा</h1>
      <p id="galleryIntro">यह दीर्घा राजा रवि वर्मा, अवनीन्द्रनाथ टैगोर, नंदलाल बोस, जगदीश स्वामीनाथन, पी.टी. रेड्डी, एम.एफ. हुसैन, के.के. हेब्बार, सुभाष बाबू और बी.ए. रेड्डी की आधुनिक भारतीय कला की उत्कृष्ट कृतियों को प्रदर्शित करती है।</p>
    </section>

    <!-- Dynamic 9 Artwork Cards Container -->
    <section class="gallery-grid" id="galleryGrid"></section>
  </main>

  <footer>
    <p>© 2024 All rights reserved, By <a href="https://anuvadini.aicte-india.org/" target="_blank" rel="noreferrer">Anuvadini AI</a></p>
  </footer>

  <script>
    const selector = document.getElementById('languageSelector');
    const galleryGrid = document.getElementById('galleryGrid');
    const galleryTitle = document.getElementById('galleryTitle');
    const galleryIntro = document.getElementById('galleryIntro');

    const langCodeMap = {
      hindi: 'hi-IN',
      english: 'en-US',
      telugu: 'te-IN',
      urdu: 'ur-PK',
      bengali: 'bn-IN',
      gujarati: 'gu-IN',
      kannada: 'kn-IN',
      odia: 'or-IN',
      marathi: 'mr-IN',
      malayalam: 'ml-IN',
      tamil: 'ta-IN'
    };

    function renderGallery(language) {
      // Pause any ongoing TTS speech
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }

      const langData = galleryTranslations[language] || galleryTranslations.hindi;
      
      // Update HTML lang attribute and text direction for RTL (Urdu)
      document.documentElement.lang = langCodeMap[language] ? langCodeMap[language].substring(0, 2) : 'hi';
      document.documentElement.dir = (language === 'urdu') ? 'rtl' : 'ltr';

      // Update Gallery Title and Description
      galleryTitle.innerHTML = langData.galleryTitle;
      galleryIntro.innerHTML = langData.galleryIntro;

      // Render all 9 artwork cards for the selected language
      galleryGrid.innerHTML = '';
      langData.items.forEach(item => {
        const article = document.createElement('article');
        article.className = 'painting-card';
        article.id = 'painting-item-' + item.id;

        const hasAudioSrc = item.audioSrc && item.audioSrc.trim() !== '';
        const hindiItem = (galleryTranslations.hindi && galleryTranslations.hindi.items) ? galleryTranslations.hindi.items.find(h => h.id === item.id) : null;
        const fullDesc = (item.desc && item.desc.trim() !== '') ? item.desc : (hindiItem ? hindiItem.desc : '');

        article.innerHTML = `
          <div class="img-container">
            <img src="${item.image}" alt="${item.title.replace(/"/g, '&quot;')}">
          </div>
          <span class="badge-acq">${langData.badgeLabel} ${item.accNo}</span>
          <h2>${item.title}</h2>
          <div class="card-desc">${fullDesc.split('\n\n').join('<br><br>')}</div>
          <div class="card-audio-controls">
            <button type="button" class="tts-btn" onclick="speakCardText(this)">
              <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
              <span>${langData.audioBtnText}</span>
            </button>
            <audio class="card-audio" controls preload="metadata" ${hasAudioSrc ? `src="${item.audioSrc}"` : ''}></audio>
          </div>
        `;

        const audioPlayer = article.querySelector('audio.card-audio');
        if (audioPlayer) {
          audioPlayer.addEventListener('play', function() {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            document.querySelectorAll('audio').forEach(a => {
              if (a !== audioPlayer) a.pause();
            });
            const currentSrc = audioPlayer.getAttribute('src');
            if (!currentSrc || currentSrc.trim() === '') {
              audioPlayer.pause();
              const ttsBtn = article.querySelector('.tts-btn');
              if (ttsBtn) speakCardText(ttsBtn);
            }
          });
        }

        galleryGrid.appendChild(article);
      });
    }

    function speakCardText(button) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Stop any active speech
        
        // Pause any HTML5 audio players
        document.querySelectorAll('audio').forEach(a => a.pause());

        const card = button.closest('.painting-card');
        const title = card.querySelector('h2').innerText;
        const desc = card.querySelector('.card-desc').innerText;
        const textToSpeak = title + ". " + desc;

        const currentLang = selector.value;
        const targetLangCode = langCodeMap[currentLang] || 'hi-IN';

        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.lang = targetLangCode;
        utterance.rate = 0.95;
        
        // Try to pick native voice for the selected language if available
        const voices = window.speechSynthesis.getVoices();
        const matchingVoice = voices.find(v => v.lang.startsWith(targetLangCode.substring(0, 2)));
        if (matchingVoice) {
          utterance.voice = matchingVoice;
        }

        window.speechSynthesis.speak(utterance);
      } else {
        alert('Speech synthesis is not supported in your browser.');
      }
    }

    // Ensure voices are loaded for SpeechSynthesis
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    selector.addEventListener('change', function() {
      renderGallery(this.value);
    });

    // Initial Render
    renderGallery(selector.value);
  </script>
<script>
/* Opening this file from inside the ZIP leaves images/, css/ and js/ behind,
   which renders a blank page. Probe one asset and explain instead. */
(function () {
  var probe = new Image();
  probe.onerror = function () {
    var b = document.createElement("div");
    b.setAttribute("style", "position:fixed;inset:0;z-index:99999;background:#7f1d1d;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;font:16px/1.7 system-ui,Segoe UI,sans-serif;text-align:center");
    b.innerHTML = '<div style="max-width:640px">' +
      '<div style="font-size:46px;margin-bottom:10px">&#128193;</div>' +
      '<h2 style="margin:0 0 14px;font-size:25px">ZIP ko pehle extract karein</h2>' +
      '<p style="margin:0 0 12px">Aap yeh page <b>ZIP ke andar se</b> khol rahe hain, isliye images, design aur text load nahi ho rahe.</p>' +
      '<p style="margin:0 0 4px"><b>Sahi tarika:</b></p>' +
      '<p style="margin:0 0 14px">ZIP par right-click &rarr; <b>Extract All&hellip;</b> &rarr; phir jo folder bane usme <b>index.html</b> kholein.</p>' +
      '<hr style="border:0;border-top:1px solid rgba(255,255,255,.35);margin:18px 0">' +
      '<p style="margin:0;opacity:.92;font-size:15px"><b>English:</b> Right-click the ZIP &rarr; <b>Extract All&hellip;</b>, then open <b>index.html</b> from the extracted folder. Opening it directly inside the ZIP leaves the images, styles and scripts behind.</p>' +
      "</div>";
    document.body.appendChild(b);
  };
  probe.src = "images/logo-moc.png";
})();
</script>
<script>
/* Audio files live in a separate folder and cannot be embedded (they are far too
   large), so a player is dead whenever this page is opened without that folder.
   Say so on the card instead of leaving a silent, broken-looking control. */
(function () {
  var MSG = "🔇 Is bhasha ka audio abhi uplabdh nahi hai. Agar aapne ZIP extract nahi kiya hai to pehle right-click → “Extract All…” karein, phir folder me se index.html kholein.";

  function flag(player) {
    if (!player || player.dataset.audioNote === "1") return;
    player.dataset.audioNote = "1";
    player.style.display = "none";
    var note = document.createElement("div");
    note.className = "audio-missing-note";
    note.textContent = MSG;
    note.setAttribute(
      "style",
      "margin-top:10px;padding:9px 12px;border-radius:8px;background:#fdecea;" +
      "color:#7f1d1d;border:1px solid #f5c2bd;font-size:12.5px;line-height:1.5;text-align:left"
    );
    if (player.parentNode) player.parentNode.insertBefore(note, player.nextSibling);
  }

  function clear(player) {
    if (!player) return;
    player.dataset.audioNote = "";
    player.style.display = "";
    var next = player.nextSibling;
    if (next && next.className === "audio-missing-note") next.parentNode.removeChild(next);
  }

  // Media errors do not bubble, so listen on the capture phase.
  document.addEventListener("error", function (e) {
    var t = e.target;
    if (t && t.tagName === "AUDIO") flag(t);
  }, true);

  document.addEventListener("loadeddata", function (e) {
    var t = e.target;
    if (t && t.tagName === "AUDIO") clear(t);
  }, true);
})();
</script>
</body>
</html>
