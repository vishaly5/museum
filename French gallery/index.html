<script>
document.addEventListener('DOMContentLoaded',function(){
var data=window.frenchGalleryContent,
selector=document.getElementById('languageSelector'),
grid=document.getElementById('galleryGrid');

function render(language){
language=String(language||'english').toLowerCase();

var intro=document.getElementById(language)||document.getElementById('english');

document.querySelectorAll('.langCnt').forEach(function(section){
section.style.display=section===intro?'block':'none'
});

if(intro){
intro.querySelector('h1').textContent=data.title[language]||data.title.english;
intro.querySelector('p').textContent=data.intro[language]||data.intro.english
}

grid.innerHTML=data.items.map(function(item,index){
var title=item[language+'Title']||item.englishTitle||item.accession;
var text=item[language]||item.english||'';
var audio=data.audioPath?data.audioPath(item,language):'';

return '<article class="item-card" onclick="if(!event.target.closest(\'audio\'))location.href=\'item'+(index+1)+'.html\'"><img src="Images/'+item.image+'" alt="'+item.accession+': '+title+'"><h2>'+item.accession+': '+title+'</h2><audio controls preload="metadata" src="'+audio+'"></audio><p>'+text+'</p></article>'
}).join('')
}

selector.onchange=function(){
render(this.value)
};

render(selector.value)
});
</script>

<script>

const d=frenchGalleryContent,
s=document.getElementById('languageSelector'),
g=document.getElementById('galleryGrid');


function path(i,l){

if(l==='hindi'){
return 'Audio/Hindi/'+encodeURI(i.hindiAudio);
}

if(l==='telugu'){
return 'Audio/Telugu/'+encodeURI(i.teluguAudio);
}

return 'Audio/English/'+encodeURI(i.englishAudio);

}


function render(l){

l=String(l||'english').toLowerCase();

document.querySelectorAll('.langCnt').forEach(e=>
e.style.display=e.id===l?'block':'none'
);


document.querySelector('#'+l+' h1').textContent=
d.title[l]||d.title.english;


document.querySelector('#'+l+' p').textContent=
d.intro[l]||d.intro.english;


g.innerHTML=d.items.map((i,n)=>`

<article
class="item-card"
onclick="if(!event.target.closest('audio'))location.href='item${n+1}.html'"
>

<img
src="Images/${i.image}"
alt="${i.accession}: ${i[l+'Title']||i.englishTitle}"
>

<h2>
${i.accession}: ${i[l+'Title']||i.englishTitle}
</h2>

<audio
controls
preload="metadata"
src="${path(i,l)}"
></audio>

<p>
${i[l]||i.english}
</p>

</article>

`).join('');

}


s.onchange=()=>render(s.value);

render(s.value);

</script>
