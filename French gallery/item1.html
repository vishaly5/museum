<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>French Gallery Item 1 | Salar Jung Museum</title><link rel="stylesheet" href="css/styles.css"><style>.detail{max-width:900px;margin:20px auto 40px;padding:25px;background:#fff;border-radius:12px;box-shadow:0 4px 20px #00000014}.detail audio{width:100%;margin-bottom:20px}.detail img{display:block;max-width:100%;max-height:460px;margin:0 auto 20px}.detail p{font-size:16px;line-height:1.8}.nav{display:flex;justify-content:space-between;max-width:900px;margin:30px auto}.btn{background:#a50309;color:#fff;padding:10px 20px;border-radius:6px;text-decoration:none}</style></head><body data-item="0"><div class="sliderHeaderDiv"><div class="container"><header><a href="index.html" class="logo logoTwo"><img src="Images/logo-moc.png" alt="Salar Jung Museum" style="width:220px"></a><div class="langDiv"><select id="languageSelector" class="formLang"><option value="hindi">हिन्दी (Hindi)</option><option value="english">English</option></select></div></header></div></div><main class="detail"><audio id="audio" controls></audio><h2 class="cntHdng"></h2><img id="image" alt=""><p id="text"></p></main><div class="nav"><span></span><a href="index.html" class="btn">Gallery Overview</a><a href="item2.html" class="btn">Next Item</a></div><script src="content.js"></script><script>const i=frenchGalleryContent.items[0],s=document.getElementById('languageSelector'),a=document.getElementById('audio');function r(l){l=String(l||'english').toLowerCase();document.querySelector('.cntHdng').textContent=i.accession+': '+i[l+'Title'];document.getElementById('image').src='Images/'+i.image;document.getElementById('text').textContent=i[l];a.src='Audio/'+(l==='hindi'?'Hindi/':'English/')+encodeURI(l==='hindi'?i.hindiAudio:i.englishAudio);a.load()}s.onchange=()=>r(s.value);r(s.value)</script></body></html>
