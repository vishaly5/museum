<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Clock Gallery Item 1 | Salar Jung Museum</title><link rel="stylesheet" href="../css/styles.css"><style>.clockItem{max-width:900px;margin:20px auto 40px;padding:25px;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.08)}.clockItem audio{width:100%;margin-bottom:20px}.clockItem img{display:block;max-width:100%;max-height:460px;margin:0 auto 20px}.clockItem p{font-size:16px;line-height:1.8}.navBtnDiv{display:flex;justify-content:space-between;max-width:900px;margin:30px auto}.navBtn{background:#a50309;color:#fff;padding:10px 20px;border-radius:6px;text-decoration:none}</style></head><body data-item="0"><div class="sliderHeaderDiv"><div class="container"><header><a href="../index.html" class="logo logoTwo"><img src="../Images/logo-moc.png" alt="Salar Jung Museum" style="width:220px"></a><div class="langDiv"><select id="languageSelector" class="formLang"><option value="hindi">हिन्दी (Hindi)</option><option value="marathi">मराठी (Marathi)</option></select></div></header></div></div><main class="clockItem"><audio id="languageAudio" controls></audio><h2 class="cntHdng"></h2><img id="itemImage" alt=""><p id="itemText"></p></main><div class="navBtnDiv"><span></span><a href="../index.html" class="navBtn">Gallery Overview</a><a href="../item2/item1.html" class="navBtn">Next Item</a></div><script src="../content.js"></script><script>const i=clockGalleryContent.items[0],s=document.getElementById('languageSelector'),a=document.getElementById('languageAudio');function render(l){document.querySelector('.cntHdng').textContent=i.accession+': '+i[l+'Title'];document.getElementById('itemImage').src='../Images/'+i.image;document.getElementById('itemText').textContent=i[l];a.src='../Audio/'+(l==='hindi'?'Hindi/':'Marathi/')+encodeURI(l==='hindi'?i.hindiAudio:i.marathiAudio);a.load()}s.onchange=()=>render(s.value);render(s.value)</script></body></html>
