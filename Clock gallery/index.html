<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Clock Gallery | Salar Jung Museum</title><link href="css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"><style>
.gallery-intro{padding:28px 6%;background:#fff;color:#2e2e2e}.gallery-intro h1{font-size:42px;margin:0 0 12px}.gallery-intro p{font-size:20px;max-width:1100px}.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:28px 6%;background:#a50309}.item-card{background:#fff;padding:14px;color:#2e2e2e;cursor:pointer;display:flex;flex-direction:column;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.1);transition:transform .2s}.item-card:hover{transform:translateY(-4px)}.item-card img{width:100%;height:270px;object-fit:contain;background:#fff;border-radius:6px}.item-card h2{font-size:18px;margin:14px 0 4px;color:#a50309;font-weight:700}.item-card audio{width:100%;margin:10px 0}.item-card p{margin-top:10px;line-height:1.55;font-size:15px;color:#333}@media(max-width:992px){.gallery-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:767px){.gallery-intro h1{font-size:30px}.gallery-intro p{font-size:17px}.gallery-grid{grid-template-columns:1fr;padding:18px 4%}.item-card img{height:240px}}
</style></head><body><div class="sliderHeaderDiv"><div class="container"><header><div class="logoLft"><a href="#" class="logo logoTwo"><img src="Images/logo-moc.png" onerror="this.onerror=null;this.src='Images/logo.png'" alt="Ministry of Culture"></a></div><div class="logoRgt"><div class="langDiv"><span class="anuIcn"><img src="Images/logo-anu.png" alt="Anuvadini"></span><select class="form formLang" id="languageSelector" aria-label="Select language"><option value="hindi">हिन्दी (Hindi)</option><option value="marathi">मराठी (Marathi)</option></select></div></div></header></div></div><main><section class="gallery-intro langCnt" id="hindi"><h1></h1><p></p></section><section class="gallery-intro langCnt" id="marathi"><h1></h1><p></p></section><section class="gallery-grid" id="galleryGrid"></section></main><footer><p>© 2024 All rights reserved, By <a href="https://anuvadini.aicte-india.org/" target="_blank" rel="noreferrer">Anuvadini AI</a></p></footer><script src="content.js"></script><script>
const data=window.clockGalleryContent,selector=document.getElementById('languageSelector'),grid=document.getElementById('galleryGrid');function audioPath(item,lang){return 'Audio/'+lang+'/'+encodeURI(lang==='Hindi'?item.hindiAudio:item.marathiAudio)}function render(lang){document.querySelectorAll('.langCnt').forEach(el=>el.style.display=el.id===lang?'block':'none');document.querySelector('#'+lang+' h1').textContent=data.title[lang];document.querySelector('#'+lang+' p').textContent=data.intro[lang];grid.innerHTML=data.items.map((item,index)=>`<article class="item-card" onclick="if(!event.target.closest('audio'))location.href='item${index+1}.html'"><img src="Images/${item.image}" alt="${item.accession}: ${item[lang+'Title']}"><h2>${item.accession}: ${item[lang+'Title']}</h2><audio controls preload="metadata" src="${audioPath(item,lang==='hindi'?'Hindi':'Marathi')}"></audio><p>${item[lang]}</p></article>`).join('')}selector.addEventListener('change',()=>render(selector.value));render(selector.value);
</script></body></html>
