<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Clock Gallery Item 1 | Salar Jung Museum</title><link href="css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"><style>.audioPlayerDiv,.bookContentDiv,.navBtnDiv{max-width:900px;margin:20px auto;padding:0 15px}.bookContentDiv{padding:25px;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.08)}.cntHdng{font-size:26px;color:#a50309}.booImgDiv{max-height:480px;display:flex;justify-content:center;padding:10px;margin:15px 0 20px;border:1px solid #eee}.booImgDiv img{max-width:100%;max-height:460px;object-fit:contain}.bookCntDiv{font-size:16px;line-height:1.8}.navBtnDiv{display:flex;justify-content:space-between;gap:10px}.navBtn{background:#a50309;color:#fff;padding:10px 20px;border-radius:6px;text-decoration:none}@media(max-width:767px){.navBtnDiv{flex-direction:column}.navBtn{text-align:center}}</style></head><body data-item="0"><div class="sliderHeaderDiv"><div class="container"><header><div class="logoLft"><a href="index.html" class="logo logoTwo"><img src="Images/logo-moc.png" onerror="this.onerror=null;this.src='Images/logo.png'" alt="Ministry of Culture"></a></div><div class="logoRgt"><div class="langDiv"><span class="anuIcn"><img src="Images/logo-anu.png" alt="Anuvadini"></span><select class="form formLang" id="languageSelector"><option value="hindi">हिन्दी (Hindi)</option><option value="marathi">मराठी (Marathi)</option></select></div></div></header></div></div><main><div class="audioPlayerDiv"><div style="background:#2e2e2e;color:#fff;padding:15px 20px;border-radius:10px"><p>Audio Explanation / ऑडियो विवरण:</p><audio id="languageAudio" controls preload="metadata" style="width:100%"></audio></div></div><section class="bookContentDiv langCnt" id="hindi"><h2 class="cntHdng"></h2><div class="booImgDiv"><img alt=""></div><div class="bookCntDiv"></div></section><section class="bookContentDiv langCnt" id="marathi"><h2 class="cntHdng"></h2><div class="booImgDiv"><img alt=""></div><div class="bookCntDiv"></div></section><div class="navBtnDiv"><span></span><a href="index.html" class="navBtn">Back to Gallery Overview</a><a href="item2.html" class="navBtn">Next Item</a></div></main><footer><p>© 2024 All rights reserved, By <a href="https://anuvadini.aicte-india.org/" target="_blank" rel="noreferrer">Anuvadini AI</a></p></footer><script src="content.js"></script><script>const item=window.clockGalleryContent.items[document.body.dataset.item],selector=document.getElementById('languageSelector'),audio=document.getElementById('languageAudio');function render(lang){document.querySelectorAll('.langCnt').forEach(el=>el.style.display=el.id===lang?'block':'none');document.querySelector('#'+lang+' h2').textContent=item.accession+': '+item[lang+'Title'];document.querySelector('#'+lang+' img').src='Images/'+item.image;document.querySelector('#'+lang+' img').alt=item.accession;document.querySelector('#'+lang+' .bookCntDiv').textContent=item[lang];audio.src='Audio/'+(lang==='hindi'?'Hindi/':'Marathi/')+encodeURI(lang==='hindi'?item.hindiAudio:item.marathiAudio);audio.load()}selector.onchange=()=>render(selector.value);render(selector.value);</script></body></html>
