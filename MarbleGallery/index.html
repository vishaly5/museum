function selectLanguage(language) {

    if (typeof updateMarbleFooter === "function") {
        updateMarbleFooter(language);
    }

    const contents = window.marbleContent[language];

    document
        .querySelectorAll(".item-card")
        .forEach(function(card) {

            const item = card.getAttribute("data-item");

            card.style.direction =
                language === "urdu" ? "rtl" : "ltr";

            if (!contents || !contents[item - 1]) {
                return;
            }

            /*
             * Marble content.js stores each item as:
             *
             * "TITLE\n\nDESCRIPTION"
             *
             * So split the title from the description.
             */
            const fullText = contents[item - 1];

            const parts = fullText.split(/\n\s*\n/);

            const titleText = parts[0].trim();

            const contentText =
                parts.slice(1).join("\n\n").trim();

            /* Update title */
            const title =
                card.querySelector("h4, h2");

            if (title) {
                title.textContent = titleText;
            }

            /* Update description */
            const contentBox =
                card.querySelector("[data-card-content]");

            if (contentBox) {
                contentBox.innerHTML =
                    contentText.replace(/\n/g, "<br>");
            }

            /* Update audio */
            const audio =
                card.querySelector(".item-audio");

            if (
                audio &&
                audioMapAll[item] &&
                audioMapAll[item][language]
            ) {
                audio.src =
                    encodeURI(audioMapAll[item][language]);

                audio.load();
            }
        });

    /* Keep selected language */
    const selector =
        document.getElementById("languageSelector");

    if (selector) {
        selector.value = language;
    }
}

document.addEventListener(
    "DOMContentLoaded",
    function() {

        const selector =
            document.getElementById(
                "languageSelector"
            );


        selectLanguage(
            selector.value
        );

    }
);
